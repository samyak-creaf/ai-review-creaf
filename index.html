<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creafinity AI Review Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="wrapper">
    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">Creafinity AI Review Assistant</h1>

      <div class="form-group">
        <label for="doctor">Clinic / Doctor</label>
        <input
          type="text"
          id="doctor"
          placeholder="Clinic or doctor name"
          readonly
        >

        <label for="location">City</label>
        <select id="location" aria-label="Select city"></select>

        <label for="treatment">Treatment received</label>
        <input
          type="text"
          id="treatment"
          placeholder="For example: Root canal treatment"
          autocomplete="off"
        >
      </div>

      <div class="row">
        <div class="field">
          <label for="comment">Your experience</label>
          <select id="comment">
            <option value="Excellent">Excellent</option>
            <option value="Very Good">Very good</option>
            <option value="Good">Good</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="length">Review length</label>
          <select id="length">
            <option value="short">Short review</option>
            <option value="medium" selected>Medium review</option>
          </select>
        </div>

        <div class="field">
          <label for="language">Language</label>
          <select id="language">
            <option value="English">English</option>
            <option value="Hindi">Hindi</option>
            <option value="Marathi">Marathi</option>
          </select>
        </div>
      </div>

      <button
        class="generate-btn"
        type="button"
        onclick="generateReview()"
      >
        Generate Review
      </button>

      <div
        id="loading"
        class="loading hidden"
        role="status"
        aria-live="polite"
      >
        Creating your review...
      </div>

      <div
        id="reviews"
        class="reviews-container"
        aria-live="polite"
      ></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
